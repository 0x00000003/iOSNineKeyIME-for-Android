// Explicit negative resolution tasks only. Never add to the normal build.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    def missing = app.configurations.create('codexMissingLockProbe')
    missing.resolutionStrategy.activateDependencyLocking()
    app.dependencies.add(missing.name, 'javax.inject:javax.inject:1')
    app.tasks.register('codexMissingLockProbe') {
        doLast { missing.resolve() }
    }
    app.dependencies.add('debugImplementation', 'com.mikepenz:community-material-typeface:7.0.96.1-kotlin')
    app.tasks.register('codexUnexpectedFontProbe') {
        doLast { app.configurations.debugRuntimeClasspath.resolve() }
    }
}
